server: {port: 0}
spring:
  application: {name: interview-service}
  datasource: {url: "${DB_URL}",username: "${DB_USER:launch}",password: "${DB_PASSWORD:launchdev}"}
  jpa:
    hibernate: {ddl-auto: validate}
  flyway: {enabled: true}
eureka:
  client:
    service-url: {defaultZone: "${EUREKA_URL:http://localhost:8761/eureka}"}
