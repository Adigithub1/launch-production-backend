server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: "jdbc:postgresql://localhost:5432/postgres"
    username: postgres
    password: "SamRad26@@$$"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: "health,info"