services:
  registry:
    build: ./service-registry
    ports: ["8761:8761"]
  auth-db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: launch, POSTGRES_PASSWORD: launchdev, POSTGRES_DB: auth_db}
    volumes: ["auth_db:/var/lib/postgresql/data"]
  auth-service:
    build: ./auth-service
    environment: {DB_URL: "jdbc:postgresql://auth-db:5432/auth_db", DB_USER: launch, DB_PASSWORD: launchdev, EUREKA_URL: "http://registry:8761/eureka"}
    depends_on: [auth-db, registry]
