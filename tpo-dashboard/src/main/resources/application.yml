server:
  port: 8082

spring:
  application:
    name: tpo-service

  datasource:
	url: ${DB_URL}
	username: ${DB_USERNAME}
	password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: tpo
    default-schema: tpo
    create-schemas: true

  jackson:
    default-property-inclusion: non_null

launch:
  frontend-origin: "http://localhost:5173"